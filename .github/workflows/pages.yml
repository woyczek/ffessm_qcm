name: Publier le QCM sur GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Vérifier le moteur et le site statique
        run: python -m unittest discover -s tests -t .
      - name: Vérifier l'interface
        run: node tests/test_ui.js
      - name: Installer le moteur navigateur pour le test
        run: npm install --no-save --package-lock=false pyodide@314.0.8
      - name: Vérifier le moteur WebAssembly et la sauvegarde navigateur
        run: node tests/test_pages_runtime.js
      - name: Construire le site public
        run: python tools/build_pages.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v5
